name: emepetres navigation
on:
  push:
    branches: [emepetres/dev]
    paths-ignore:
      - 'docs/**'
      - 'wps/emepetres/**'
      - 'tools/emepetres/visual_preview.py'
      - '.github/workflows/emepetres-visual.yml'
  workflow_dispatch:
    inputs:
      extended_library:
        description: Run the optional large-library screenshot/OCR journey
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.scope.outputs.linux }}
      windows: ${{ steps.scope.outputs.windows }}
      baseline: ${{ steps.scope.outputs.baseline }}
      library: ${{ steps.scope.outputs.library }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Select the checks affected by this change
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          before = os.environ.get('BEFORE_SHA', '')
          known = before and set(before) != {'0'} and subprocess.run(
              ['git', 'cat-file', '-e', before + '^{commit}'],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not known:
              linux = windows = baseline = library = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', before, 'HEAD']).decode().split('\0')
              paths = [p for p in paths if p and not p.startswith('docs/')]
              windows = any(p.startswith('tools/emepetres/lastfm/') or
                  p.startswith('apps/plugins/lastfm_') or
                  p == '.github/workflows/emepetres-navigation.yml' for p in paths)
              linux_paths = [p for p in paths if not p.startswith('tools/emepetres/lastfm/') and p not in (
                  '.github/workflows/emepetres-target-build.yml',
                  '.github/workflows/emepetres-vendor-audit.yml',
                  'tools/emepetres/tests/test_vendor_audit.py') and
                  not p.startswith('tools/emepetres/vendor')]
              linux = bool(linux_paths)
              baseline = any(p != 'tools/emepetres/tests/simulator_library_smoke.py' and
                  not p.startswith(('tools/emepetres/tests/library_',
                      'tools/emepetres/tests/test_library_',
                      'tools/emepetres/tests/ocr_fixtures/')) for p in linux_paths)
              library = any(p != 'tools/emepetres/tests/simulator_smoke.py' for p in linux_paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for name, value in dict(linux=linux, windows=windows,
                      baseline=baseline, library=library).items():
                  stream.write(f'{name}={str(value).lower()}\n')
          PY
  navigation:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Install build dependencies on the runner
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libasound2-dev zip perl xvfb xdotool ffmpeg tesseract-ocr
      - name: Navigation regression tests
        run: python3 -m unittest discover -s tools/emepetres/tests -p 'test_*.py' -v
      - name: Check whether verified simulator binaries can be reused
        id: reuse
        run: |
          # This seed run built both simulators successfully. Reuse is allowed
          # only when every firmware/build input is identical, irrespective of
          # changes to docs, CI orchestration or the separate Windows/test tools.
          seed=d54edb3b55c6ba74f24d6ed1e1a1bdd9adc7cfa2
          git cat-file -e "$seed^{commit}" || git fetch --no-tags --depth=1 origin "$seed"
          if git diff --quiet "$seed" HEAD -- . ':!docs' ':!.github' ':!tools/emepetres'; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        id: simulator_cache
        if: steps.reuse.outputs.verified == 'true'
        continue-on-error: true
        with:
          name: emepetres-linux-simulators-NOT-FIRMWARE
          run-id: 43270897309
          github-token: ${{ github.token }}
          path: .
      - name: Build both simulators
        if: steps.reuse.outputs.verified != 'true' || steps.simulator_cache.outcome == 'failure'
        run: |
          for target in agptekrocker agptekrockernative; do
            mkdir "build-$target"
            cd "build-$target"
            ../tools/configure --target="$target" --type=s
            make -j2
            make zip
            cd ..
          done
      - name: Prepare verified simulator executables
        run: |
          chmod +x build-agptekrocker/rockboxui build-agptekrockernative/rockboxui
      - name: Launch simulators with an isolated synthetic music library
        if: needs.changes.outputs.baseline == 'true'
        run: |
          xvfb-run -a python3 tools/emepetres/tests/simulator_smoke.py build-agptekrocker
          xvfb-run -a python3 tools/emepetres/tests/simulator_smoke.py build-agptekrockernative
      - name: Exercise scrolling, searches and album boundaries with 2054 synthetic tracks
        if: needs.changes.outputs.library == 'true' && github.event_name == 'workflow_dispatch' && inputs.extended_library
        run: |
          failed=0
          for target in agptekrocker agptekrockernative; do
            if ! xvfb-run -a python3 tools/emepetres/tests/simulator_library_smoke.py "build-$target"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emepetres-linux-simulators-NOT-FIRMWARE
          path: |
            build-agptekrocker/rockboxui
            build-agptekrocker/rockbox.zip
            build-agptekrockernative/rockboxui
            build-agptekrockernative/rockbox.zip
            build-*/smoke-results/
            build-*/library-results/
  lastfm-windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools/emepetres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline sync, Windows protection and interface tests
        run: python -m unittest discover -s tools/emepetres/lastfm/tests -v
      - name: Build standalone Windows application
        run: |
          python -m pip install pyinstaller==6.17.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name emepetres-lastfm --paths tools/emepetres tools/emepetres/lastfm/launcher.py
      - name: Launch packaged application without network or account data
        shell: pwsh
        run: |
          $smokeData = Join-Path $env:RUNNER_TEMP 'emepetres-smoke'
          $smokeProcess = Start-Process -FilePath (Resolve-Path 'dist/emepetres-lastfm.exe') -ArgumentList @('--data-dir', $smokeData, '--smoke') -WindowStyle Hidden -PassThru -Wait
          if ($smokeProcess.ExitCode -ne 0) { throw 'Packaged application smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: emepetres-LastFM-Windows
          path: |
            dist/emepetres-lastfm.exe
            docs/EMEPETRES_LASTFM.md
